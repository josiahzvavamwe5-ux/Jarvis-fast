<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS by Josiah - Vision + Files</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>body{margin:0;background:#000;color:#fff;font-family:monospace} button{cursor:pointer}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const GEM=AQ.Ab8RN6Jd-qPBb9TLT_nS48AqKSwmNyLoabm78yAEHcSPSJcYsA;
const ELEVEN=zZECw207oBY1aT4t9tKu;
const VOICE="onwK4e9ZLuTAKqWW03F9";
function App(){
 const [mode,setMode]=React.useState('idle');
 const [you,setYou]=React.useState("");
 const [jarvis,setJarvis]=React.useState("Tap core - Fast <4s + Vision + Files - Creator Josiah");
 const [user,setUser]=React.useState(JSON.parse(localStorage.getItem('jarvis')||'null'));
 const [pending,setPending]=React.useState(null);
 const [fileData,setFileData]=React.useState(null);
 const [fileName,setFileName]=React.useState("");
 const fileRef=React.useRef(null);

 const speak=async(t)=>{
  setJarvis(t); setMode('speaking');
  try{
   const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE}?optimize_streaming_latency=4`,{
    method:'POST',headers:{'xi-api-key':ELEVEN,'Content-Type':'application/json'},
    body:JSON.stringify({text:t.slice(0,400),model_id:"eleven_turbo_v2_5"})
   });
   if(r.ok){ const b=await r.blob(); const u=URL.createObjectURL(b); const a=new Audio(u); a.onended=()=>setMode('idle'); a.play(); return; }
  }catch(e){}
  const ut=new SpeechSynthesisUtterance(t); ut.rate=1.05; ut.pitch=0.7; ut.onend=()=>setMode('idle'); speechSynthesis.speak(ut);
 };

 const analyseFile=async(prompt)=>{
  if(!fileData){ speak(`Indeed, ${user.honorific} ${user.name}. Please upload a picture, PDF or file first, Sir.`); return; }
  setMode('processing');
  try{
   const isImage=fileData.startsWith('data:image');
   const isPDF=fileName.toLowerCase().endsWith('.pdf');
   let parts=[];
   if(isImage){
     const base64=fileData.split(',')[1];
     const mime=fileData.match(/data:(.*?);/)[1];
     parts=[{text:`You are JARVIS, sophisticated British Butler, creator Josiah, master ${user.name}. Analyse this image/file: ${fileName}. User asks: ${prompt}. Reply <60 words, Indeed Sir style.`},{inlineData:{mimeType:mime,data:base64}}];
   }else{
     parts=[{text:`You are JARVIS, creator Josiah, master ${user.name}. User uploaded file ${fileName}. Base64 content: ${fileData.slice(0,20000)}. User asks: ${prompt}. Analyse it. Reply <80 words Indeed style.`}];
   }
   const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEM}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts}],generationConfig:{maxOutputTokens:150}})
   });
   const d=await r.json();
   const txt=d.candidates?.[0]?.content?.parts?.[0]?.text||`Indeed, Sir ${user.name}. I have analysed ${fileName}.`;
   speak(txt);
  }catch(e){ speak(`Indeed, Sir ${user.name}. File analysis failed, but I am here.`); }
 };

 const ask=async(p)=>{
  const low=p.toLowerCase();
  if(fileData && (low.includes('analys')||low.includes('picture')||low.includes('image')||low.includes('pdf')||low.includes('file')||low.includes('what is this')||low.includes('what do you see'))){
   analyseFile(p); return;
  }
  if(low.includes('who are you')||low.includes('who created')||low.includes('who owns')){
   speak(`Indeed, ${user.honorific} ${user.name}. I am JARVIS Mobile, crafted by my creator Josiah to make life simpler for everyone. I can now analyse pictures, PDFs and files, Sir. Master ${user.name} owns me, yet creator remains Josiah.`); return;
  }
  if(low.includes('time')){ speak(`Indeed, Sir ${user.name}. Time is ${new Date().toLocaleTimeString()}`); return; }
  setMode('processing');
  try{
   const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEM}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:`You are JARVIS sophisticated British Butler male, creator Josiah, master ${user.name}, reply <50 words, Indeed style. User:${p}${fileData?` User has uploaded file ${fileName}`:''}`}]}],generationConfig:{maxOutputTokens:100}})
   });
   const d=await r.json();
   speak(d.candidates?.[0]?.content?.parts?.[0]?.text||`Indeed, Sir ${user.name}. Acknowledged.`);
  }catch{ speak(`Indeed, Sir ${user.name}. Uplink slow.`); }
 };

 const handleFile=(e)=>{
  const f=e.target.files[0]; if(!f) return; setFileName(f.name);
  const reader=new FileReader();
  reader.onload=(ev)=>{
   setFileData(ev.target.result);
   speak(`Indeed, ${user?user.honorific:'Sir'} ${user?user.name:'Mike'}. File ${f.name} uploaded. I can now analyse pictures, PDFs, images, documents, Sir. Say Hey Jarvis analyse this file.`);
  };
  if(f.type.startsWith('image/')) reader.readAsDataURL(f);
  else if(f.type==='application/pdf' || f.name.endsWith('.pdf')) reader.readAsDataURL(f);
  else reader.readAsText(f);
 };

 const start=()=>{
  const SR=window.webkitSpeechRecognition||window.SpeechRecognition;
  if(!SR) return;
  const rec=new SR(); rec.lang='en-ZA'; rec.continuous=false;
  rec.onstart=()=>setMode('listening');
  rec.onresult=(e)=>{
   const full=e.results[0][0].transcript; setYou(full);
   if(!full.toLowerCase().includes('jarvis')) return;
   const m=full.toLowerCase().match(/it's\s+([a-z]+)/);
   if(m&&!user){
    if(!pending){ setPending(m[1]); speak(`Pleasure, ${m[1]}. Sir or Madam? Creator Josiah, you master.`); }
    else{ const g=full.toLowerCase().includes('madam')?"Ma'am":'Sir'; const u={name:pending,honorific:g}; localStorage.setItem('jarvis',JSON.stringify(u)); setUser(u); setPending(null); speak(`Indeed, ${g} ${pending}. Master ${pending} owns me, creator Josiah. I can analyse pictures and PDFs now.`); }
    return;
   }
   const cmd=full.replace(/hey jarvis/gi,'').trim(); if(cmd) ask(cmd);
  };
  rec.onend=()=>setMode('idle'); rec.start();
 };

 return React.createElement('div',{style:{minHeight:'100vh',background:'radial-gradient(#0a1a3a,#000)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:15}},
  React.createElement('div',{onClick:start,style:{width:280,height:380,border:'2px solid #00aaff',borderRadius:20,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',boxShadow:'0 0 30px #00aaff',cursor:'pointer',padding:10}},
   React.createElement('div',{style:{fontSize:40}},mode==='listening'?'🎙️':mode==='processing'?'⚡':mode==='speaking'?'🔊':'◉'),
   React.createElement('p',{style:{marginTop:10,textAlign:'center',fontSize:9}},jarvis),
   React.createElement('p',{style:{marginTop:8,fontSize:7,opacity:0.6}},user?`MASTER ${user.name.toUpperCase()} • CREATOR JOSIAH`:'TAP CORE - SAY HEY JARVIS IT IS YOUR NAME'),
   fileData?React.createElement('div',{style:{marginTop:8,border:'1px solid #0f0',padding:'4px 8px',borderRadius:6,background:'#0f02'}},
     React.createElement('p',{style:{margin:0,fontSize:6,color:'#0f0'}},`📎 ${fileName.slice(0,20)} READY`),
     isImage=>fileData.startsWith('data:image')?React.createElement('img',{src:fileData,style:{width:60,height:40,objectFit:'cover',marginTop:4,borderRadius:4}}):null
   ):null
  ),
  React.createElement('div',{style:{marginTop:12,display:'flex',gap:8}},
   React.createElement('button',{onClick:()=>fileRef.current.click(),style:{padding:'8px 14px',background:'#00aaff',color:'#000',border:0,borderRadius:20,fontSize:9,fontWeight:700}},`📎 Upload Picture/PDF/File`),
   fileData?React.createElement('button',{onClick:()=>{setFileData(null); setFileName(""); speak(`File removed Sir.`);},style:{padding:'8px 12px',background:'#ff2d78',color:'#fff',border:0,borderRadius:20,fontSize:9}},'❌ Clear'):null
  ),
  React.createElement('input',{type:'file',ref:fileRef,accept:'image/*,.pdf,.txt,.doc,.docx,.csv,.json',onChange:handleFile,style:{display:'none'}}),
  React.createElement('p',{style:{marginTop:10,fontSize:8,textAlign:'center',opacity:0.8,maxWidth:300}},you||'Say: Hey Jarvis analyse this picture / this PDF / what do you see?'),
  React.createElement('p',{style:{fontSize:6,opacity:0.4,marginTop:6,textAlign:'center'}},'FAST <4s • VISION • PDF • FILES • MASTER DYNAMIC • CREATOR JOSIAH LOCKED')
 );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
